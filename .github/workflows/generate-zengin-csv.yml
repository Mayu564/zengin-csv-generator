name: Generate Zengin Codes CSV

on:
  push:
    branches:
      - main # mainブランチへのプッシュ時に実行 (変更したい場合はここを変更)
  schedule:
    # 毎日UTC午前0時（日本時間午前9時）に実行
    # データの更新頻度に合わせて調整してください
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行を許可

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # Python 3.8, 3.9, 3.10, 3.11, 3.12 など

    - name: Install zengin-code library
      run: pip install zengin-code

    - name: Install mojimoji library # 半角カタカナ変換ライブラリ
      run: pip install mojimoji

    - name: Run Python script to generate Zengin CSV
      run: python generate_zengin_csv.py

    - name: Upload generated CSV as artifact # GitHub Actionsの成果物として保存 (ダウンロード用)
      uses: actions/upload-artifact@v4
      with:
        name: zengin-codes-csv
        path: zengin_codes.csv # 生成されたCSVファイルのパス

    - name: Commit and push CSV to repository # 生成されたCSVをリポジトリにコミット
      # このステップは、スケジュール実行時と手動実行時のみに限定します
      # こうすることで、CSVファイルのコミットが原因で、
      # pushイベントのワークフローが無限ループするのを防ぎます。
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add zengin_codes.csv
        # 変更がなければコミットしないようにする (エラー防止)
        git diff-index --quiet HEAD || git commit -m "feat: Update zengin_codes.csv [skip ci]"
        git push
